[workspace]
resolver = "2"
members = [
    "crates/dibibest-core",
    "crates/dibibest-cli",
    "crates/dibibest-mcp",
    "crates/dibibest-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Anaz S. Aji"]
repository = "https://github.com/codecoradev/dibibest"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sqlparser = "0.63"

[profile.release]
strip = true
lto = true
