[package]
name = "dibibest-server"
description = "The dibibest server: one process behind one origin (web app, API, live WebSocket, MCP)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "dibibest-server"
path = "src/main.rs"

[dependencies]
dibibest-core = { path = "../dibibest-core" }
dibibest-store = { path = "../dibibest-store" }
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "sync"] }
tower-http = { version = "0.6", features = ["limit"] }
tower = "0.5"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mime_guess = "2"
percent-encoding = "2"
serde = { workspace = true }
serde_json = { workspace = true }
ring = "0.17"
base64 = "0.22"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "test-util"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
