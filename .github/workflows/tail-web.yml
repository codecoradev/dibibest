name: Tail Web Logs

# Streams the Pages Functions real-time logs of the production deployment into
# this job's log for a few minutes, to debug the remote MCP and sign-in
# without the Cloudflare dashboard. Manual only.
#
# `--format pretty` prints the request line, status and console output (the
# `mcp: ...` lines from server/mcp.ts); it does not print request headers, so
# bearer tokens never reach the job log.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to tail, in minutes (1-15)
        default: '5'
        required: true

permissions:
  contents: read

jobs:
  tail:
    name: Tail dibibest (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Tail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          case "$MINUTES" in ''|*[!0-9]*) echo "::error::minutes must be a number"; exit 1;; esac
          [ "$MINUTES" -ge 1 ] && [ "$MINUTES" -le 15 ] || { echo "::error::minutes must be 1-15"; exit 1; }
          echo "tailing for ${MINUTES}m: reconnect the connector now"
          timeout "${MINUTES}m" npx --yes wrangler@4 pages deployment tail \
            --project-name dibibest --environment production --format pretty || [ $? -eq 124 ]
