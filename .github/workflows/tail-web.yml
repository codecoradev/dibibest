name: Tail Web Logs

# Streams the Pages Functions real-time logs of the production deployment into
# this job's log for a few minutes, to debug the remote MCP and sign-in
# without the Cloudflare dashboard. Manual only.
#
# `--format pretty` prints the request line, status and console output (the
# `mcp: ...` lines from server/mcp.ts); it does not print request headers, so
# bearer tokens never reach the job log.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to tail, in minutes (1-15)
        default: '5'
        required: true

permissions:
  contents: read

jobs:
  tail:
    name: Tail dibibest (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Tail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          case "$MINUTES" in ''|*[!0-9]*) echo "::error::minutes must be a number"; exit 1;; esac
          [ "$MINUTES" -ge 1 ] && [ "$MINUTES" -le 15 ] || { echo "::error::minutes must be 1-15"; exit 1; }
          # wrangler needs a deployment id in non-interactive mode: take the
          # newest production deployment
          DEPLOYMENT=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/dibibest/deployments?env=production&per_page=1" \
            | jq -r '.result[0].id')
          [ -n "$DEPLOYMENT" ] && [ "$DEPLOYMENT" != null ] || { echo "::error::no production deployment found"; exit 1; }
          echo "tailing deployment $DEPLOYMENT for ${MINUTES}m: reconnect the connector now"
          timeout "${MINUTES}m" npx --yes wrangler@4 pages deployment tail "$DEPLOYMENT" \
            --project-name dibibest --format pretty || [ $? -eq 124 ]
