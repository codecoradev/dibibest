name: Deploy Web

# Deploys apps/web (static SPA + auth Pages Functions) to Cloudflare Pages
# (epic #52). Runs on pushes to develop and on demand; never on pull requests,
# so the Cloudflare credentials are not exposed to PR code.
#
# Needs the org secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID with access granted to this repository.
# Optional repo secrets DIBIBEST_OIDC_CLIENT_SECRET and DIBIBEST_SESSION_SECRET
# are synced to the Pages project as runtime secrets (see apps/web/wrangler.toml).

on:
  push:
    branches: [develop]
    paths:
      - 'apps/web/**'
      - 'crates/**'
      - 'Cargo.lock'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  PROJECT: dibibest
  # Production branch of the Pages project. develop until a main branch exists.
  PRODUCTION_BRANCH: develop
  CUSTOM_DOMAIN: dibibest.codecora.dev

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    # Cloudflare credentials are passed only to the steps that call Cloudflare,
    # never to install/build steps (third-party install scripts must not see them).
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Check Cloudflare credentials
        env:
          CF_API: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not available to this repository. Grant it access to the org secrets."
            exit 1
          fi

      - name: Ensure the Pages project exists
        env:
          CF_API: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/project.json -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "$CF_API/$PROJECT")
          if [ "$code" = 200 ]; then
            echo "project $PROJECT exists"
          elif [ "$code" = 404 ]; then
            curl -fsS -X POST -H "Authorization: Bearer $CF_TOKEN" -H 'content-type: application/json' \
              -d "{\"name\":\"$PROJECT\",\"production_branch\":\"$PRODUCTION_BRANCH\"}" "$CF_API" > /dev/null
            echo "created project $PROJECT (production branch $PRODUCTION_BRANCH)"
          else
            echo "::error::Cloudflare API answered $code for project $PROJECT"; cat /tmp/project.json; exit 1
          fi

      - name: Prepare runtime secrets
        id: secrets
        env:
          OIDC_CLIENT_SECRET: ${{ secrets.DIBIBEST_OIDC_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.DIBIBEST_SESSION_SECRET }}
        run: |
          if [ -n "$OIDC_CLIENT_SECRET" ] && [ -n "$SESSION_SECRET" ]; then
            umask 077
            jq -n --arg c "$OIDC_CLIENT_SECRET" --arg s "$SESSION_SECRET" \
              '{OIDC_CLIENT_SECRET: $c, SESSION_SECRET: $s}' > "$RUNNER_TEMP/pages-secrets.json"
            echo "sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign-in secrets not set: sign-in stays off (the app works without it)"
            echo "sync=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync runtime secrets
        if: steps.secrets.outputs.sync == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages secret bulk ${{ runner.temp }}/pages-secrets.json --project-name=${{ env.PROJECT }}

      - name: Remove the secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/pages-secrets.json"

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy --project-name=${{ env.PROJECT }} --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }}

      - name: Attach the custom domain
        if: github.ref_name == env.PRODUCTION_BRANCH
        env:
          CF_API: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/domain.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CF_TOKEN" -H 'content-type: application/json' \
            -d "{\"name\":\"$CUSTOM_DOMAIN\"}" "$CF_API/$PROJECT/domains")
          if [ "$code" = 200 ] || grep -qi 'already' /tmp/domain.json; then
            echo "custom domain $CUSTOM_DOMAIN attached"
          else
            # Not fatal: the site is deployed; the domain can be added once in the dashboard.
            echo "::warning::Could not attach $CUSTOM_DOMAIN (HTTP $code). Add it under Workers & Pages → $PROJECT → Custom domains, or give the token DNS/Pages permissions."
            cat /tmp/domain.json
          fi
