name: Image

# Builds the server image (the root Dockerfile, see docs/deploy.md) and, when switched on, pushes it to GHCR.
#
# Runs on pushes to develop and on demand, never on pull requests: nothing here is for pull-request code to
# reach. The VPS pulls a new image by hand (`docker compose pull && docker compose up -d`); this workflow does not
# touch the VPS and holds no SSH key.
#
# THE PUSH IS OFF UNTIL SOMEONE SWITCHES IT ON. The build always runs (it proves the image builds for the VPS's
# architecture); the push happens only when the repository variable GHCR_PUSH is the text `true`
# (Settings > Secrets and variables > Actions > Variables). The first push, and whether the package is public or
# private, are the owner's to decide.
#
# Repository variables, all optional:
#   GHCR_PUSH         `true` to push. Anything else, or unset, builds without pushing.
#   IMAGE_PLATFORMS   what to build for, default `linux/amd64`. `linux/amd64,linux/arm64` builds both (the
#                     second one under QEMU emulation, which is slow: expect an hour, and the build job's
#                     time limit is 120 minutes).
#
# The Docker actions are pinned to a commit (the tag is in the comment): the publish job holds `packages: write`.
# Dependabot's github-actions updates move the pins.
#
# Tags pushed: `develop` (moves with every push) and `sha-<seven characters>` (never moves). There is no `latest`:
# a deploy names a tag, so a rollback is a tag. Release tags are made by hand and are not handled here.

on:
  push:
    branches: [develop]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'apps/web/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  PLATFORMS: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}

jobs:
  build:
    name: Build the image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: ${{ contains(env.PLATFORMS, 'arm64') }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build only, into the cache: the publish job below reuses it, so the work is done once.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: false
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Push to GHCR
    needs: build
    # The gate. A skipped job is not a failure. Only develop is ever pushed, also when the run was started by hand
    # from another branch.
    if: ${{ vars.GHCR_PUSH == 'true' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: ${{ contains(env.PLATFORMS, 'arm64') }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Without this the action also adds `latest` for the default branch.
          flavor: latest=false
          tags: |
            type=raw,value=develop
            type=sha,format=short
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
